name: build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:

permissions:
  contents: write # attach the exe to a release on tag pushes

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet -tags xz,zstd,lz4 ./...
      - run: CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go vet -tags xz,zstd,lz4 ./...
      # fixture tests skip without BM_FIXTURES (building them needs mkfs.* tools); unit tests still run
      - run: go test -tags xz,zstd,lz4 ./...
      - run: make build
      - uses: actions/upload-artifact@v4
        with:
          name: backup-mounter
          path: backup-mounter.exe
      - if: startsWith(github.ref, 'refs/tags/v')
        # the release may already exist (made in the GitHub UI, which also pushes the tag)
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" backup-mounter.exe --clobber
        env:
          GH_TOKEN: ${{ github.token }}
